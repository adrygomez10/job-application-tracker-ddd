name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  code-style:
    name: Code style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Java style with Spotless and Checkstyle
        run: docker compose -f compose.style.yaml run --rm --no-deps check
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned development checks
        run: |
          python3 -m venv .venv-style
          .venv-style/bin/python -m pip install -r requirements-style.txt
      - name: Check staged project exactly as precommit
        run: .venv-style/bin/python scripts/check_project.py --staged
      - name: Upload reports and fictional screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification
          path: |
            target/**
