minimum_pre_commit_version: '4.7.0'
default_install_hook_types: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: project-quality
        name: Staged project quality, architecture and behavior
        language: system
        entry: python scripts/check_project.py --staged
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit, manual]
